services:
  telegram-bot-api:
    image: docker.io/aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot:
    image: ghcr.io/sknarovs/yt-dlp-bot:latest
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_API_URL: http://telegram-bot-api:8081
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-2000}
    # Reaps yt-dlp/ffmpeg processes that get orphaned when a download is killed
    init: true
    depends_on:
      - telegram-bot-api
    restart: unless-stopped
    # Uncomment to use cookies for sites that need a login:
    # volumes:
    #   - ./cookies.txt:/app/cookies.txt:ro

volumes:
  telegram-bot-api-data:
